[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "simply-connect"
version = "0.1.0"
description = "Official typed Python SDK for the Simply Connect External API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simply Connect" }]
keywords = ["simply-connect", "sms", "telephony", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Documentation = "https://simply-connect.ovh/integrations/python"
Issues = "https://github.com/karlos1998/simply-connect-python/issues"
Repository = "https://github.com/karlos1998/simply-connect-python"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
  "twine>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simply_connect"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=simply_connect --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["simply_connect"]
