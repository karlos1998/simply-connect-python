name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify release version
        run: python -c 'import os, simply_connect; assert "v" + simply_connect.__version__ == os.environ["GITHUB_REF_NAME"]'
      - name: Install release wheel
        run: |
          python -m venv /tmp/simply-connect-release
          /tmp/simply-connect-release/bin/pip install dist/*.whl
          /tmp/simply-connect-release/bin/python -c 'import simply_connect; assert simply_connect.__version__ == "0.1.0"'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "Simply Connect Python ${GITHUB_REF_NAME#v}"

